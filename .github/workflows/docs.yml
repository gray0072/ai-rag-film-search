name: Docs

# I21: checks every relative link in the repository's Markdown and builds the documentation site (VitePress,
# tools/docs-site) from docs/. Pushes to main publish the site to GitHub Pages; pull requests only check and build.

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "docs/**"
      - "tools/docs-site/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "**.md"
      - "docs/**"
      - "tools/docs-site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Link check and site build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/docs-site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: src/web/.nvmrc
          cache: npm
          cache-dependency-path: tools/docs-site/package-lock.json

      - name: Link check
        run: npm run check-links

      - name: Install
        run: npm ci

      # VitePress fails the build on a link to a page that does not exist.
      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: tools/docs-site/dist

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
